<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:{{font}};">
  <tr>
    <td style="padding:0 0 10px 0;background-color:transparent;">{{logo_block}}</td>
  </tr>
  <tr>
    <td style="padding:0;font-family:{{font}};">
      {{#if name}}
      <div style="font-family:{{font}};font-size:18px;line-height:22px;font-weight:bold;color:{{text}};">{{name}}</div>
      {{/if}}
      {{#if title}}
      <div style="font-family:{{font}};font-size:12px;line-height:16px;color:{{muted}};">{{title}}</div>
      {{/if}}
      {{#if department}}
      <div style="font-family:{{font}};font-size:12px;line-height:16px;color:{{muted}};">{{department}}</div>
      {{/if}}
      {{#if company}}
      <div style="font-family:{{font}};font-size:12px;line-height:16px;color:{{primary}};font-weight:bold;padding-top:2px;">{{company}}</div>
      {{/if}}
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:10px;">
        {{phone_row}}
        {{email_row}}
        {{web_row}}
      </table>
      {{socials}}
    </td>
  </tr>
</table>
